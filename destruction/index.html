<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Destruction</title>
    <style>
      html, body { height: 100%; margin: 0; background: #16140f; color: #efe9dd; overflow: hidden; }
      body { font: 14px/1.4 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #view { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center; background: #16140f; z-index: 50;
        transition: opacity 0.6s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .card { display: grid; gap: 14px; justify-items: center; padding-inline: 16px; text-align: center; }
      #boot h1 {
        margin: 0; font: 600 clamp(40px, 9vw, 88px)/0.9 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
        letter-spacing: 0.06em; text-transform: uppercase;
      }
      #boot .rule { width: min(320px, 70vw); height: 1px; background: #efe9dd33; position: relative; overflow: hidden; }
      #boot .rule::after {
        content: ''; position: absolute; inset: 0; width: 30%; background: #ffb547;
        animation: sweep 1.4s cubic-bezier(.6, 0, .4, 1) infinite;
      }
      #boot p { margin: 0; font: 12px/1.5 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; letter-spacing: 0.08em; color: #efe9ddb3; max-width: 46ch; }
      #boot.error .rule::after { animation: none; width: 100%; background: #e2583e; }
      @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { #boot .rule::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="boot" role="status" aria-live="polite">
      <div class="card">
        <h1>Destruction</h1>
        <div class="rule"></div>
        <p id="boot-msg">FİZİK MOTORU YÜKLENİYOR</p>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
